<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GROUPIE-TRACKER</title>
</head>
<body>
    <nav>
        <a href="/">Retour à l'acceuil</a>
    </nav>

    <h2>{{.Name}}</h2>
    <img src="{{.Image}}" alt="Photo de {{.Name}}">
    <p>Création : {{.CreationDate}}</p>
    <p>Premier album : {{.FirstAlbum}}</p>
    <p>Membres : {{range .Members}}{{.}} / {{end}}</p>
    <p>Lieux : {{range .Location}}{{.}} / {{end}}</p>
    <p>Dates : {{range .Date}}{{.}} / {{end}}</p>
</body>
</html>
